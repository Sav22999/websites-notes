<html>

<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="../css/style.css"/>
    <title>Notefox - All notes</title>
    <link rel="icon" href="../img/icon.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=0.8"/>
</head>

<body>
<div class="splash-screen" id="splash-screen-all-notes">
    <img src="../img/logo-orange.svg"/>
    <div class="lds-spinner" id="loading-splash-screen">
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
        <div></div>
    </div>
</div>
<aside>
    <div class="aside-container">
        <div class="aside-buttons">
            <button id="all-notes-aside" class="aside-button sel"></button>
            <button id="settings-aside" class="aside-button"></button>
            <button id="help-aside" class="aside-button external-link"></button>
            <button id="donate-aside" class="aside-button external-link"></button>
            <button id="translate-aside" class="aside-button external-link"></button>
            <button id="website-aside" class="aside-button external-link"></button>
        </div>

        <div class="aside-version">
            <div class="separator"></div>
            <div id="version-aside"></div>
        </div>
    </div>
</aside>
<div id="all-notes-dedication-section">
    <h1 id="title-all-notes-dedication-section" class="hidden">All notes</h1>
    <div class="section text-align-right" id="actions">
        <input type="button" value="Buy me a coffee!" id="buy-me-a-coffee-button" class="button donate-button hidden"/>
        <input type="button" value="Settings" id="settings-all-notes-button" class="button settings-button hidden"/>
        <input type="button" value="Refresh data" id="refresh-all-notes-button" class="button refresh-button"/>
    </div>
    <div class="section text-align-left sticky-section" id="search-filter-sortby">
        <div class="search-grid-area">
            <div id="search-all-notes-container" class="textbox custom-tag-input-container">
                <input type="text" value="" placeholder="Search…" id="search-all-notes-text"
                       class="tag-inner-input search-all-notes-text"/>
            </div>
        </div>
        <!--<input type="button" value="Sort by…" id="sort-by-all-notes-button" class="button sort-by-button float-right"/>-->
        <div class="buttons-grid">
            <input type="button" value="Filter…" id="filter-all-notes-button"
                   class="button filter-button button-no-text-on-mobile"/>
            <select name="theme" id="sort-by-all-notes-button" class="button sort-by-button no-text">
                <option value="name-az" id="sort-by-name-az-select">Name: A-Z</option>
                <option value="name-za" id="sort-by-name-za-select">Name: Z-A</option>
                <option value="date-90" id="sort-by-date-90-select">Last update: Oldest-Newest</option>
                <option value="date-09" id="sort-by-date-09-select">Last update: Newest-Oldest</option>
            </select>
        </div>
    </div>
    <div class="section text-align-left hidden sticky-section" id="filters">
        <div id="filter-folder-section" class="margin-bottom-10-px">
            <span id="filter-folder-label-span"></span>:
            <div id="filter-folder-input" class="textbox custom-tag-filter-input"></div>
        </div>
        <div id="filter-tags-text-section" class="margin-bottom-10-px">
            <span id="filter-tags-text-label-span"></span>:
            <div id="filter-tags-text-input" class="textbox custom-tag-filter-input"></div>
        </div>
        <div id="filter-colour-section" class="margin-bottom-10-px">
            <span id="filter-colour-label-span"></span>:
            <div id="filter-colour-input" class="textbox custom-tag-filter-input"></div>
        </div>
        <div id="filter-type-section" class="margin-bottom-10-px">
            <span id="filter-type-label-span"></span>:
            <div id="filter-type-input" class="textbox custom-tag-filter-input"></div>
        </div>
    </div>
    <div class="section text-align-left hidden" id="results-searching"></div>
    <div class="section text-align-left" id="all-notes-view-bar">
        <div class="all-notes-view-tabs">
            <input type="button" value="All notes" id="view-active-notes-button"
                   class="button very-small-button view-tab-button view-tab-active"/>
            <input type="button" value="Archive" id="view-archive-notes-button"
                   class="button very-small-button view-tab-button"/>
        </div>
        <div class="all-notes-view-actions">
            <input type="button" value="Manage labels" id="manage-labels-open-button"
                   class="button very-small-button tag-button"/>
        </div>
    </div>
    <div class="section text-align-left hidden" id="selection-toolbar">
        <div class="selection-toolbar-left">
            <label class="select-all-label" for="select-all-notes-checkbox">
                <input type="checkbox" id="select-all-notes-checkbox" class="note-select-checkbox"/>
                <span id="select-all-notes-label">Select all</span>
            </label>
            <span id="selected-notes-count" class="selected-notes-count hidden"></span>
        </div>
        <div class="selection-toolbar-actions">
            <input type="button" value="Labels" id="bulk-labels-button"
                   class="button very-small-button tag-button hidden"/>
            <input type="button" value="Archive" id="bulk-archive-button"
                   class="button very-small-button archive-button hidden"/>
            <input type="button" value="Export selected…" id="export-selected-notes-button"
                   class="button very-small-button export-button hidden"/>
        </div>
    </div>

    <br class="br-big-space"/>

    <div id="disable-sync" class="hidden section section-warning margin-bottom-20-px">
        Due to some space limitation with "sync" I advise you to disable the data synced in this page. Otherwise, the
        add-on should not work properly anymore!
        <br>
        To do that, in the add-on Settings find <span class="button-code" id="string-save-on-local-instead-of-sync">Save data locally instead of sync with Firefox account</span>
        and set to <span id="string-save-on-local-instead-of-sync-yes" class="button-code">Yes</span>.
    </div>

    <div id="loading-notes-section" class="section-empty section-loading" role="status" aria-live="polite">
        <span class="notes-loading-spinner" aria-hidden="true"></span>
        <span id="loading-notes-text">Loading…</span>
    </div>

    <span id="all-website-sections"></span>
</div>

<div id="background-opacity"></div>
<!--donation popup-->
<div id="donation-alert-section" class="message-popup">
    <div id="donation-alert-content" class="section message-popup-content">
        <div id="donation-title" class="padding-10 message-popup-content-title"></div>
        <div id="donation-text" class="padding-10 message-popup-content-description"></div>
        <div id="donation-buttons" class="padding-10 text-align-right message-popup-content-buttons">
            <input type="button" value="" id="donation-buy-button"
                   class="button" tabindex="2"/>
            <input type="button" value="" id="donation-remind-button"
                   class="button" tabindex="1"/>
            <input type="button" value="" id="donation-never-button"
                   class="button" tabindex="1"/>
        </div>
    </div>
</div>
<!--login expired popup-->
<div id="login-expired-section" class="message-popup">
    <div id="login-expired-content" class="section">
        <div id="login-expired-title" class="padding-10"></div>
        <div id="login-expired-text" class="padding-10"></div>
        <div id="login-expired-buttons" class="padding-10 text-align-right">
            <input type="button" value="" id="login-expired-button" class="button login-button" tabindex="1"/>
            <input type="button" value="" id="login-expired-cancel-button" class="button" tabindex="2"/>
        </div>
    </div>
</div>
<!--notefox server error-->
<div id="notefox-server-error-section" class="message-popup">
    <div id="notefox-server-error-content" class="section">
        <div id="notefox-server-error-title" class="padding-10"></div>
        <div id="notefox-server-error-text" class="padding-10"></div>
        <div id="notefox-server-error-text2" class="padding-10"></div>
        <div id="notefox-server-error-text3" class="padding-10"></div>
        <div id="notefox-server-error-buttons" class="padding-10 text-align-right">
            <input type="button" value="" id="notefox-server-error-button1" class="button logout-button" tabindex="1"/>
            <input type="button" value="" id="notefox-server-error-button2" class="button" tabindex="2"/>
        </div>
    </div>
</div>
<!--export selected notes popup-->
<div id="export-section" class="message-popup">
    <div class="section" id="export-sub-sections">
        <div class="padding-10">
            <div id="text-export"></div>
        </div>
        <div class="padding-10">
            <textarea id="json-export" class="text-json" readonly spellcheck="false"></textarea>
        </div>
        <div class="padding-10 text-align-right">
            <input type="button" value="" id="cancel-export-all-notes-button" class="button float-left"/>
            <input type="button" value="" id="export-to-file-button" class="button download-button"/>
            <input type="button" value="" id="copy-now-all-notes-button" class="button copy-button"/>
        </div>
    </div>
</div>
<!--manage labels popup-->
<div id="manage-labels-section" class="message-popup">
    <div class="section message-popup-content" id="manage-labels-sub-sections">
        <div class="manage-labels-header">
            <div id="manage-labels-title" class="manage-labels-title"></div>
        </div>
        <div class="manage-labels-tabs" role="tablist">
            <button type="button" id="manage-labels-tab-tags" class="manage-labels-tab view-tab-active" role="tab" aria-selected="true"></button>
            <button type="button" id="manage-labels-tab-folders" class="manage-labels-tab" role="tab" aria-selected="false"></button>
        </div>
        <div class="manage-labels-create-row">
            <input type="text" id="manage-labels-new-input" class="textbox manage-labels-new-input" value=""/>
            <input type="button" value="Create" id="manage-labels-create-button" class="button manage-labels-create-btn"/>
        </div>
        <div id="manage-labels-list" class="manage-labels-list"></div>
        <div class="manage-labels-footer">
            <input type="button" value="" id="close-manage-labels-button" class="button button-close-notefox-account"/>
        </div>
    </div>
</div>
<!--bulk labels floating menu (direct child of body so it always stays in foreground)-->
<div id="bulk-labels-menu" class="bulk-labels-menu hidden" role="dialog"></div>
<!--fullscreen notes viewer-->
<div id="fullscreen-notes-viewer" class="content-notes--container content-notes">
    <pre id="fullscreen-notes-viewer-content" class="textarea-all-notes"></pre>
    <button class="button-format button" id="close-fullscreen-notes-button"></button>
</div>
<script src="../js/note-identity.js"></script>
<script src="../js/definitions.js"></script>

</body>

</html>
